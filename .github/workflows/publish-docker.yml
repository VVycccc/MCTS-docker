name: publish-docker

# Build the deployable image on GitHub's runners and push it to ghcr.io,
# so target machines can `docker pull ghcr.io/vvycccc/mcts-docker:slim`
# directly (the dev machine's upstream to registries is throttled).
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "scripts/export_champions.py"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # slim profile: no AKG python stack (langchain/langgraph/transformers);
      # akg_frontend code stays in the image and degrades gracefully, the
      # naive+MCTS main path is unaffected.
      - name: Use slim requirements
        run: cp requirements-slim.txt requirements.txt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vvycccc/mcts-docker:slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
